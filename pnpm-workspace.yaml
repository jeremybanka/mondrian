packages:
  - packages/*

allowBuilds:
  "@vscode/vsce-sign": false
  dprint: true
  skia-canvas: true
  unrs-resolver: false

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Permit the verified eMudhra security patch before the usual release-age delay.
  - dprint@0.64.1
  - "@dprint/android-arm64@0.64.1"
  - "@dprint/android-x64@0.64.1"
  - "@dprint/darwin-arm64@0.64.1"
  - "@dprint/darwin-x64@0.64.1"
  - "@dprint/freebsd-arm64@0.64.1"
  - "@dprint/freebsd-x64@0.64.1"
  - "@dprint/linux-arm64-glibc@0.64.1"
  - "@dprint/linux-arm64-musl@0.64.1"
  - "@dprint/linux-loong64-glibc@0.64.1"
  - "@dprint/linux-loong64-musl@0.64.1"
  - "@dprint/linux-ppc64-glibc@0.64.1"
  - "@dprint/linux-ppc64-musl@0.64.1"
  - "@dprint/linux-riscv64-glibc@0.64.1"
  - "@dprint/linux-riscv64-musl@0.64.1"
  - "@dprint/linux-s390x-glibc@0.64.1"
  - "@dprint/linux-x64-glibc@0.64.1"
  - "@dprint/linux-x64-musl@0.64.1"
  - "@dprint/win32-arm64@0.64.1"
  - "@dprint/win32-x64@0.64.1"
  - break-check
  - breakage
  - comline
  - recoverage
  - takua
  - treetrunks
  - typescript@7.0.2
  - "@typescript/typescript-aix-ppc64@7.0.2"
  - "@typescript/typescript-darwin-arm64@7.0.2"
  - "@typescript/typescript-darwin-x64@7.0.2"
  - "@typescript/typescript-freebsd-arm64@7.0.2"
  - "@typescript/typescript-freebsd-x64@7.0.2"
  - "@typescript/typescript-linux-arm@7.0.2"
  - "@typescript/typescript-linux-arm64@7.0.2"
  - "@typescript/typescript-linux-loong64@7.0.2"
  - "@typescript/typescript-linux-mips64el@7.0.2"
  - "@typescript/typescript-linux-ppc64@7.0.2"
  - "@typescript/typescript-linux-riscv64@7.0.2"
  - "@typescript/typescript-linux-s390x@7.0.2"
  - "@typescript/typescript-linux-x64@7.0.2"
  - "@typescript/typescript-netbsd-arm64@7.0.2"
  - "@typescript/typescript-openbsd-arm64@7.0.2"
  - "@typescript/typescript-openbsd-x64@7.0.2"
  - "@typescript/typescript-sunos-x64@7.0.2"
  - "@typescript/typescript-win32-arm64@7.0.2"
  - "@typescript/typescript-win32-x64@7.0.2"
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
verifyDepsBeforeRun: error

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    typescript: ^5.0.0 || ^6.0.0 || ^7.0.0
    vite: "*"
    vitest: "*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  "@vitest/coverage-v8": 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
