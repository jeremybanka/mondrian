[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tools]
bun = "1.4.4"
ni = "30.6.0"
node = "26.12.1"
pnpm = "12.15.0"
ripgrep = "15.2.0"

# Dagger's 1.0 beta releases are distributed at dl.dagger.io, not GitHub Releases.
[tools."http:dagger"]
version = "1.0.0-beta.21"
url = 'https://dl.dagger.io/dagger/releases/{{ version }}/dagger_v{{ version }}_{{ os(macos="darwin") }}_{{ arch(x64="amd64") }}.tar.gz'
checksum_url = "https://dl.dagger.io/dagger/releases/{{ version }}/checksums.txt"

[tools."http:dagger".platforms.windows-x64]
url = "https://dl.dagger.io/dagger/releases/{{ version }}/dagger_v{{ version }}_windows_amd64.zip"

[tools."http:dagger".platforms.windows-arm64]
url = "https://dl.dagger.io/dagger/releases/{{ version }}/dagger_v{{ version }}_windows_arm64.zip"
